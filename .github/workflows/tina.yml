# A TINA responde de verdade em produção?
#
# O /diagnostico diz se a chave existe e se a última chamada falhou; não diz
# se a assistente responde algo que preste. Este workflow faz UMA pergunta à
# TINA no site e confere: status 200, texto de resposta, e o aviso de que a
# plataforma não substitui contador ou advogado. Cada execução gasta uma
# chamada ao modelo — por isso é manual (workflow_dispatch), não agendado.
#
# Rode pela aba Actions depois de mexer no prompt, na base de conhecimento ou
# na chave. O texto da resposta sai no log, para ler.
#
# A PORTARIA. Com SITE_SENHA ligada no painel da Railway, o site inteiro
# responde 401 — inclusive /api/chat/tina. Sem a senha aqui, este workflow
# falharia com 401 e pareceria a TINA quebrada, quando o problema é a porta.
#
# Por isso ele manda a senha como Basic auth quando o segredo existe. O
# segredo é do repositório (Settings → Secrets and variables → Actions →
# SITE_SENHA) e tem de ter o MESMO valor da variável na Railway: trocou lá,
# troca aqui. Sem o segredo, o workflow roda como antes — o que continua
# certo depois da virada, quando o site abrir e a portaria sair.
name: TINA responde

on:
  workflow_dispatch:
    inputs:
      pergunta:
        description: 'Pergunta a fazer à TINA'
        required: false
        default: 'Quem pode destinar parte do imposto de renda pela Lei Rouanet?'

permissions:
  contents: read

jobs:
  pergunta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      URL: https://www.incentivabr.com.br
      PERGUNTA: ${{ inputs.pergunta || 'Quem pode destinar parte do imposto de renda pela Lei Rouanet?' }}
      SITE_SENHA: ${{ secrets.SITE_SENHA }}
    steps:
      - name: A TINA responde, e responde com o aviso
        run: |
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request
          url = os.environ['URL'] + '/api/chat/tina'
          corpo = json.dumps({'message': os.environ['PERGUNTA'], 'history': []}).encode()
          cabecalhos = {'Content-Type': 'application/json'}

          # A portaria confere só a senha; o usuário vai para preencher o
          # formato "usuario:senha" e não é olhado (server.js).
          senha = (os.environ.get('SITE_SENHA') or '').strip()
          if senha:
              cred = base64.b64encode(f'ci:{senha}'.encode()).decode()
              cabecalhos['Authorization'] = 'Basic ' + cred
              print('portaria: mandando a senha do segredo SITE_SENHA')
          else:
              print('portaria: sem segredo SITE_SENHA — só funciona com o site aberto')

          req = urllib.request.Request(url, data=corpo, headers=cabecalhos, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  status, texto = r.status, r.read().decode()
          except urllib.error.HTTPError as e:
              status, texto = e.code, e.read().decode()
          print('status:', status)
          print(texto[:2000])

          # 401 é a porta, não a assistente. Dizer isso evita a caçada ao
          # defeito errado — foi para isso que a mensagem existe.
          if status == 401:
              print('::error::401 na portaria do site, não na TINA. Confira o segredo '
                    'SITE_SENHA do repositório: ele tem de ter o mesmo valor da variável '
                    'SITE_SENHA no painel da Railway.')
              sys.exit(1)
          if status != 200:
              print(f'::error::a TINA respondeu {status}'); sys.exit(1)
          d = json.loads(texto)
          resposta = d.get('reply') or ''
          if len(resposta) < 40:
              print('::error::resposta curta demais ou vazia'); sys.exit(1)
          baixo = resposta.lower()
          if 'contador' not in baixo and 'advogado' not in baixo:
              print('::error::a resposta nao traz o aviso de que a plataforma nao substitui contador ou advogado')
              sys.exit(1)
          print('ok: a TINA respondeu com', len(resposta), 'caracteres e com o aviso')
          PY

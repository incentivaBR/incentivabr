# CI mínimo — Raio-X de set/2026, risco 09 ("zero CI").
#
# Roda a suíte do backend a cada push e a cada pull request. A suíte usa
# pg-mem: não precisa de Postgres nem de chave nenhuma. Se um teste quebrar,
# o check fica vermelho no PR e no commit de main.
#
# Deploy só com verde: na Railway, Settings → Deploy → "Wait for CI" faz o
# serviço esperar este check passar antes de publicar o commit de main.
# A proteção do branch main (GitHub → Settings → Branches → require status
# checks → "Testes do backend") impede o merge com o check vermelho.
# As duas configurações são feitas no painel, não neste arquivo.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior: só o último
# commit interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do backend/Dockerfile (node:20-alpine).
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          NODE_ENV: test

  # A suíte em pg-mem é tolerante onde o Postgres não é, e isso já derrubou o
  # cadastro em produção com o CI verde. Este job sobe um Postgres 16 real,
  # roda schema + seeds + todas as migrations num banco vazio, confere que o
  # segundo boot não reaplica nada, e exercita o cadastro e o login contra o
  # banco de verdade. Só o Postgres decide o que o Postgres aceita.
  postgres:
    name: Postgres de verdade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # O teste apaga o schema antes de começar e só aceita banco cujo
          # nome termine em _teste ou _test.
          POSTGRES_DB: incentivabr_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run test:postgres
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incentivabr_teste

  # Abre cada página num Chromium contra o servidor local com a CSP ligada.
  # Falha se a política bloquear alguma coisa ou se Tailwind, Font Awesome ou
  # Montserrat não carregarem. É o que impede uma CSP apertada demais (ou um
  # CDN novo fora dela) de quebrar uma tela em produção sem ninguém ver.
  paginas:
    name: Páginas no Chromium (CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # O Playwright não é dependência do produto; entra só aqui.
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - run: node scripts/confere-paginas.mjs

  # Os fluxos de ponta a ponta, como uma pessoa faria: calcular, entrar pelo
  # formulário, ver o painel, conferir, listar interessados — contra o
  # servidor em memória que finge o site da Casa Azul. É o que confere que as
  # peças encaixam, não só que cada uma existe.
  e2e:
    name: Fluxos no Chromium (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - run: node scripts/e2e.mjs

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- TINA, set/2026: traço simples, fundo creme, olhos fechados sorrindo, flor coral no cabelo (cor de acento da marca). Desenho próprio, vetor. -->
  <circle cx="40" cy="40" r="40" fill="#FBF4EC"/>
  <!-- cabelo solto, um só volume macio -->
  <path d="M 21 46 C 17 30 26 15 40 15 C 54 15 63 30 59 46 C 61 56 56 64 52 68 L 28 68 C 24 64 19 56 21 46 Z" fill="#3E2A22"/>
  <!-- rosto -->
  <path d="M 27 33 C 27 24 33 20 40 20 C 47 20 53 24 53 33 L 53 42 C 53 51 47 56 40 56 C 33 56 27 51 27 42 Z" fill="#F7DCC8"/>
  <!-- franja em curva -->
  <path d="M 26 34 C 27 22 34 18 42 18 C 50 18 55 23 55 33 C 51 27 45 26 39 27 C 34 28 29 30 26 34 Z" fill="#3E2A22"/>
  <!-- olhos fechados, sorrindo -->
  <path d="M 31.5 38.5 Q 34.5 35.5 37.5 38.5" stroke="#3E2A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 42.5 38.5 Q 45.5 35.5 48.5 38.5" stroke="#3E2A22" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- bochechas -->
  <circle cx="32" cy="44" r="3.2" fill="#F3A48E" opacity="0.45"/>
  <circle cx="48" cy="44" r="3.2" fill="#F3A48E" opacity="0.45"/>
  <!-- nariz mínimo e boca -->
  <path d="M 39.5 42 Q 40 45 41 45" stroke="#D9A78C" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 35.5 49 Q 40 52.5 44.5 49" stroke="#C9606C" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <!-- flor de acento no cabelo -->
  <g transform="translate(55 30)">
    <circle r="2.2" cx="0" cy="-3.2" fill="#EE985C"/><circle r="2.2" cx="3" cy="-1" fill="#EE985C"/>
    <circle r="2.2" cx="1.9" cy="2.6" fill="#EE985C"/><circle r="2.2" cx="-1.9" cy="2.6" fill="#EE985C"/>
    <circle r="2.2" cx="-3" cy="-1" fill="#EE985C"/><circle r="1.5" fill="#FBF4EC"/>
  </g>
  <!-- blusa navy -->
  <path d="M 24 80 C 24 66 31 62 40 62 C 49 62 56 66 56 80 Z" fill="#0F1E3D"/>
</svg>
